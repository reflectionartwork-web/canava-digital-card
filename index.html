<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canava Textile Gallery - Digital Card</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Montserrat for text, Great Vibes for calligraphy slogan -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Pure Matte Palette */
            --bg-body: #ecefe6;
            --card-white: #ffffff;
            --matte-navy: #0a1128;
            --matte-navy-hover: #172652;
            --soft-border: #e0e4ec;
            --soft-bg: #f5f7fa;
            --text-dark: #0a1128;
            --text-muted: #5c6880;
            --text-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            color: var(--text-dark);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-white);
            border-radius: 20px;
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(10, 17, 40, 0.08);
            border: 1px solid var(--soft-border);
            text-align: center;
            position: relative;
        }

        .logo-header-area {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('background.jpg');
            background-size: cover;
            background-position: center;
            padding: 40px 20px 25px; 
            color: var(--text-white);
        }

        .brand-logo {
            width: 100%;
            max-width: 280px; 
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        .slogan {
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            font-weight: 400;
            color: var(--text-white);
            margin-top: 15px;
            letter-spacing: 1px;
            text-transform: none;
        }

        .header-divider {
            height: 1px;
            background-color: var(--soft-border);
            border: none;
        }

        .main-content {
            padding: 30px 25px;
        }

        .socials-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--soft-bg);
            border: 1px solid var(--soft-border);
            color: var(--matte-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background: var(--matte-navy);
            color: var(--card-white);
            border-color: var(--matte-navy);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text-dark);
            background: var(--soft-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--soft-border);
            transition: all 0.2s ease;
        }

        .info-item:hover {
            border-color: var(--matte-navy);
            background: #ffffff;
        }

        .info-item i {
            color: var(--matte-navy);
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .info-text {
            font-size: 13px;
            font-weight: 500;
            word-break: break-word;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--matte-navy);
            color: var(--card-white);
        }

        .btn-primary:hover {
            background: var(--matte-navy-hover);
            color: var(--card-white);
        }

        .btn-secondary {
            background: transparent;
            color: var(--matte-navy);
            border: 1px solid var(--matte-navy);
        }

        .btn-secondary:hover {
            background: var(--soft-bg);
        }

        .footer-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 20px;
            letter-spacing: 1px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card-container">
        
        <div class="logo-header-area">
            <img src="logo.png" alt="Canava Textile Gallery Logo" class="brand-logo">
            <div class="slogan">Where Luxury Is Woven</div>
        </div>

        <hr class="header-divider">

        <div class="main-content">
            <div class="socials-section">
                <a href="https://wa.me/963946433300" target="_blank" class="social-btn" title="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="https://www.instagram.com/canavaaleppo" target="_blank" class="social-btn" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://t.me/m123hammad" target="_blank" class="social-btn" title="Telegram">
                    <i class="fab fa-telegram-plane"></i>
                </a>
            </div>

            <div class="contact-info">
                <a href="tel:+963946433300" class="info-item">
                    <i class="fas fa-phone-alt"></i>
                    <div class="info-text">+963 946 433 300</div>
                </a>

                <a href="mailto:canavatextile@gmail.com" class="info-item">
                    <i class="far fa-envelope"></i>
                    <div class="info-text">canavatextile@gmail.com</div>
                </a>

                <a href="https://maps.google.com/?q=36.220867,37.126011" target="_blank" class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <div class="info-text">Aleppo - Syria - Almogambo - Patchi st.</div>
                </a>
            </div>

            <div class="action-buttons">
                <!-- تم التعديل هنا: تحويل الزر إلى رابط لتحميل أو عرض ملف PDF -->
                <a href="portfolio.pdf" target="_blank" class="btn btn-primary">
                    <i class="fas fa-images"></i> Our Portfolio
                </a>
                <button class="btn btn-secondary" onclick="downloadVCard()">
                    <i class="fas fa-address-card"></i> Save Contact (vCard)
                </button>
            </div>

            <div class="footer-tag">
                © CANAVA TEXTILE GALLERY
            </div>
        </div>

    </div>

    <script>
        // vCard Creation Logic
        function downloadVCard() {
            const vCardData = `BEGIN:VCARD
VERSION:3.0
N:Gallery;Canava;Textile;;
FN:Canava Textile Gallery
ORG:Canava Textile Gallery
TITLE:Textile Gallery
TEL;TYPE=CELL,VOICE:+963946433300
EMAIL;TYPE=INTERNET:canavatextile@gmail.com
URL;TYPE=Instagram:https://www.instagram.com/canavaaleppo
ADR;TYPE=WORK:;;Patchi St., Almogambo;Aleppo;;Syria
NOTE:Where Luxury Is Woven
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Canava_Textile_Gallery.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
