<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canava Textile Gallery - Digital Card</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Montserrat for text, Great Vibes for calligraphy slogan -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Pure Matte Palette */
            --bg-body: #ecefe6;
            --card-white: #ffffff;
            --matte-navy: #0a1128;
            --matte-navy-hover: #172652;
            --soft-border: #e0e4ec;
            --soft-bg: #f5f7fa;
            --text-dark: #0a1128;
            --text-muted: #5c6880;
            --text-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            color: var(--text-dark);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-white);
            border-radius: 20px;
            overflow: hidden; /* Important for background effects */
            box-shadow: 0 10px 30px rgba(10, 17, 40, 0.08);
            border: 1px solid var(--soft-border);
            text-align: center;
            position: relative;
        }

        /* Darkened Background Area under Logo & Slogan */
        .logo-header-area {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('background.jpg');
            background-size: cover;
            background-position: center;
            padding: 40px 20px 25px; /* Spacing above/below logo and slogan */
            color: var(--text-white);
        }

        /* FIXED: Changed from .brand-logo.png to .brand-logo */
        .brand-logo {
            width: 100%;
            max-width: 280px; /* Sized nicely to display prominent and clear */
            height: auto;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        .slogan {
            font-family: 'Great Vibes', cursive;
            font-size: 28px;
            font-weight: 400;
            color: var(--text-white);
            margin-top: 15px;
            letter-spacing: 1px;
            text-transform: none;
        }

        /* Divider below the dark header area */
        .header-divider {
            height: 1px;
            background-color: var(--soft-border);
            border: none;
        }

        /* The main content area below the dark header */
        .main-content {
            padding: 30px 25px;
        }

        /* Small Circular Social Buttons */
        .socials-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--soft-bg);
            border: 1px solid var(--soft-border);
            color: var(--matte-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .social-btn:hover {
            background: var(--matte-navy);
            color: var(--card-white);
            border-color: var(--matte-navy);
        }

        /* Contact Details Section */
        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text-dark);
            background: var(--soft-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--soft-border);
            transition: all 0.2s ease;
        }

        .info-item:hover {
            border-color: var(--matte-navy);
            background: #ffffff;
        }

        .info-item i {
            color: var(--matte-navy);
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .info-text {
            font-size: 13px;
            font-weight: 500;
            word-break: break-word;
        }

        /* Buttons Section */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-primary {
            background: var(--matte-navy);
            color: var(--card-white);
        }

        .btn-primary:hover {
            background: var(--matte-navy-hover);
        }

        .btn-secondary {
            background: transparent;
            color: var(--matte-navy);
            border: 1px solid var(--matte-navy);
        }

        .btn-secondary:hover {
            background: var(--soft-bg);
        }

        .footer-tag {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 20px;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Modal Overlay for Portfolio */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(10, 17, 40, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-white);
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            padding: 25px 20px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--matte-navy);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .close-btn:hover {
            color: var(--matte-navy);
        }

        .modal-gallery {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .gallery-img {
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--soft-border);
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="card-container">
        
        <!-- Darkened Header Area with Background & White Logo -->
        <div class="logo-header-area">
            <!-- FIXED: Make sure your image file is named logo.png in the same folder -->
            <img src="logo.png" alt="Canava Textile Gallery Logo" class="brand-logo">
            <div class="slogan">Where Luxury Is Woven</div>
        </div>

        <hr class="header-divider">

        <!-- The rest of the card content area -->
        <div class="main-content">
            <!-- Social Media Section -->
            <div class="socials-section">
                <a href="https://wa.me/963946433300" target="_blank" class="social-btn" title="WhatsApp">
                    <i class="fab fa-whatsapp"></i>
                </a>
                <a href="https://www.instagram.com/canavaaleppo" target="_blank" class="social-btn" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://t.me/m123hammad" target="_blank" class="social-btn" title="Telegram">
                    <i class="fab fa-telegram-plane"></i>
                </a>
            </div>

            <!-- Contact Section -->
            <div class="contact-info">
                <!-- Phone Number -->
                <a href="tel:+963946433300" class="info-item">
                    <i class="fas fa-phone-alt"></i>
                    <div class="info-text">+963 946 433 300</div>
                </a>

                <!-- Email -->
                <a href="mailto:canavatextile@gmail.com" class="info-item">
                    <i class="far fa-envelope"></i>
                    <div class="info-text">canavatextile@gmail.com</div>
                </a>

                <!-- Location -->
                <a href="https://maps.google.com/?q=36.220867,37.126011" target="_blank" class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <div class="info-text">Aleppo - Syria - Almogambo - Patchi st.</div>
                </a>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="openPortfolio()">
                    <i class="fas fa-images"></i> Our Portfolio
                </button>
                <button class="btn btn-secondary" onclick="downloadVCard()">
                    <i class="fas fa-address-card"></i> Save Contact (vCard)
                </button>
            </div>

            <div class="footer-tag">
                © CANAVA TEXTILE GALLERY
            </div>
        </div>

    </div>

    <!-- Portfolio Popup Modal -->
    <div class="modal" id="portfolioModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Our Portfolio</span>
                <button class="close-btn" onclick="closePortfolio()">&times;</button>
            </div>
            <div class="modal-gallery">
                <img src="photo_2026-08-01_13-30-21.jpg" alt="Natural Wool Upholstery" class="gallery-img">
                <img src="photo_2026-08-01_13-30-39.jpg" alt="Luxury Fabric Sofa" class="gallery-img">
                <img src="photo_2026-08-01_13-30-43.jpg" alt="Patterned Fabric Chair" class="gallery-img">
            </div>
        </div>
    </div>

    <script>
        // Modal Logic
        function openPortfolio() {
            document.getElementById('portfolioModal').style.display = 'flex';
        }

        function closePortfolio() {
            document.getElementById('portfolioModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('portfolioModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // vCard Creation Logic
        function downloadVCard() {
            const vCardData = `BEGIN:VCARD
VERSION:3.0
N:Gallery;Canava;Textile;;
FN:Canava Textile Gallery
ORG:Canava Textile Gallery
TITLE:Textile Gallery
TEL;TYPE=CELL,VOICE:+963946433300
EMAIL;TYPE=INTERNET:canavatextile@gmail.com
URL;TYPE=Instagram:https://www.instagram.com/canavaaleppo
ADR;TYPE=WORK:;;Patchi St., Almogambo;Aleppo;;Syria
NOTE:Where Luxury Is Woven
END:VCARD`;

            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', 'Canava_Textile_Gallery.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
